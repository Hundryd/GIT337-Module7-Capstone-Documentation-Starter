<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Hundryd — Independent in Motion</title>
  <desc id="desc">A monochrome planet surrounded by orbital paths and small stars.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#292929"/>
      <stop offset="1" stop-color="#090909"/>
    </radialGradient>
    <radialGradient id="planet" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".62" stop-color="#ccc"/>
      <stop offset="1" stop-color="#777"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" fill="url(#space)"/>
  <text x="64" y="78" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="7">HUNDRYD</text>
  <g fill="none" stroke="#aaa" stroke-width="1.5" opacity=".55">
